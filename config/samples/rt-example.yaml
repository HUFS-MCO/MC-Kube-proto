apiVersion: mcoperator.sdv.com/v1
kind: McKube
metadata:
  name: rt-test-pod-config
  namespace: default
spec:
  podname: "rt-test-pod"
  criticality: "high"
  rtSettings:
    period: 1000000     # 1 second in microseconds
    runtime: 500000     # 500ms runtime
    core: "2-3"         # Use cores 2-3
---
apiVersion: v1
kind: Pod
metadata:
  name: rt-test-pod
  namespace: default
  labels:
    app: rt-test
spec:
  containers:
  - name: test-container
    image: nginx:latest